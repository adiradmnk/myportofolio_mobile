name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI: build_runner, dart format, flutter analyze, dan flutter test + coverage.
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  # CD: build APK release hanya jika job build berhasil.
  build_apk:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate json_serializable code
        run: dart run build_runner build --delete-conflicting-outputs
      # Variabel repositori API_BASE_URL (Settings > Secrets and variables >
      # Actions > Variables) dipakai jika ada; jika kosong, pakai URL PWS agar
      # nilai kosong tidak menimpa defaultValue di lib/config.dart.
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://adriana-ainurrahmah-myportofolio.pws.cs.ui.ac.id' }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
